name: npm

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm ci wipes node_modules, so restore encoded images after it; a miss falls back to the newest cache
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp', 'static/**/*.jpg', 'static/**/*.png', 'package-lock.json') }}
          restore-keys: imagetools-

      - name: Run linting
        run: npm run lint

      - name: Check images
        run: node ./check-images.js

      - name: Run build
        run: npm run build
